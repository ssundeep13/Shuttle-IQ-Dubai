    <!-- PWA manifest -->

    <!-- Theme color -->

    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- SEO -->
    <meta name="description" content="Book badminton sessions across the UAE. Live rankings, ELO skill ratings, smart matchmaking, and real-time queue management. Join the community at ShuttleIQ." />
    <meta name="application-name" content="ShuttleIQ" />
    <meta name="keywords" content="badminton, UAE, Dubai, book sessions, sports booking, player rankings, skill rating, matchmaking" />
    <link rel="canonical" href="https://shuttleiq.ai/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShuttleIQ" />
    <meta property="og:title" content="ShuttleIQ — Book Badminton Sessions in UAE" />
    <meta property="og:description" content="Book badminton sessions across the UAE. Live rankings, ELO skill ratings, smart matchmaking, and real-time queue management." />
    <meta property="og:image" content="https://shuttleiq.ai/icons/icon-512x512.png" />
    <meta property="og:url" content="https://shuttleiq.ai/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShuttleIQ — Book Badminton Sessions in UAE" />
    <meta name="twitter:description" content="Book badminton sessions across the UAE. Live rankings, ELO skill ratings, smart matchmaking, and real-time queue management." />
    <meta name="twitter:image" content="https://shuttleiq.ai/icons/icon-512x512.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsActivityLocation",
      "name": "ShuttleIQ",
      "description": "Book badminton sessions across the UAE. Live rankings, ELO skill ratings, smart matchmaking, and real-time queue management.",
      "url": "https://shuttleiq.ai",
      "sport": "Badminton",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "AE"
      },
      "potentialAction": {
        "@type": "ReserveAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://shuttleiq.ai/marketplace/book"
        },
        "result": {
          "@type": "Reservation",
          "name": "Badminton Session Booking"
        }
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts (Design Gate 2, hybrid): Inter 400-700 = body, Montserrat 600/700 =
         display (headings, CTAs, wordmark, hero numbers). Only the weights in use;
         display=swap; preloaded so the stylesheet is not render-blocking. Measured
         payload: Montserrat 600+700 latin ~74 KB, Inter latin ~47 KB (variable). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap">

    <!-- Service Worker registration -->
    <script>
      // The native Capacitor shell injects a global `window.Capacitor` (with
      // isNativePlatform()) before any app script runs. On the web this is
      // undefined, so the PWA service worker registers exactly as before.
      // Inside the native shell we skip registration entirely: the SW's asset
      // caching conflicts with how Capacitor serves the bundle and can pin
      // stale assets ("old version showing"). The web's SW lives on a different
      // origin (the website), so it is never visible to the native shell.
      (function () {
        var cap = window.Capacitor;
        var isNative = !!(cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform());
        if (isNative) return;
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function (err) {
              console.warn('Service Worker registration failed:', err);
            });
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
